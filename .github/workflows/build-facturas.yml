name: Compilar Facturas

on:
  push:
    branches: [main]
    paths:
      - 'Facturas/**'
      - '.github/workflows/build-facturas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet publish Facturas/Facturas.csproj -c Release -o out

      - name: Ver archivos generados
        shell: bash
        run: ls -la out

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Facturas-exe
          path: out/Facturas.exe

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: facturas-v${{ github.run_number }}
          name: Facturas (compilacion ${{ github.run_number }})
          files: out/Facturas.exe
